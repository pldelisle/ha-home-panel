name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# The lint job checks formatting and runs ESLint on a plain Node 22 runner. The test and visual jobs run on GitHub's
# arm64 runners inside the Playwright image for the pinned version, the same image and Chromium a maintainer uses
# locally through Docker or `container` (npm run test:visual:docker). The screenshot baselines are recorded in that
# image, so they compare there.
jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm test -- --coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      # the screenshots run in the visual job
      - run: npx playwright test --project=tablet --project=phone
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
  visual:
    needs: lint
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            test-results/
            playwright-report/
