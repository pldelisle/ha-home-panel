name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Both jobs run on GitHub's arm64 runners inside the Playwright image for the pinned version, the same image and Chromium
# a maintainer uses locally (npm run test:visual:docker). The screenshot baselines are recorded there, so they compare there.
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm test
      # the screenshots run in the visual job
      - run: npx playwright test --project=tablet --project=phone
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
  visual:
    runs-on: ubuntu-24.04-arm
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: |
            test-results/
            playwright-report/
