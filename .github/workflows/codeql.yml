name: CodeQL
# Scans the JavaScript and TypeScript for known vulnerability patterns on every push to main, on pull requests and
# weekly (Monday 09:00 UTC), so that a new query pack reaches code that has not changed. Findings appear under the
# repository's Security > Code scanning tab. This is the advanced setup, a workflow file; the repository's "default
# setup" for code scanning must stay off, or the two conflict. Python is added when and if the HACS integration
# exists.
#
# init and analyze are the same release of github/codeql-action and must stay on the same commit (Renovate bumps
# them together). The build step is not needed: javascript-typescript is interpreted, so CodeQL reads the sources
# as they are.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
