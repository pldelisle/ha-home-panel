name: Version PR
# Keeps one "Release" pull request open (branch changeset-release/main) that collects the changesets merged into main:
# it bumps package.json, writes CHANGELOG.md and syncs the ?v= snippets (npm run version-packages; not named
# "version", which npm would also run after every `npm version`). Merging it is the release
# decision; tagging and the GitHub release are the release workflow's job, not this one's.
#
# With no changesets on main the action only logs and exits, so the run is a no-op. It pushes the version branch with
# GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not start workflows, so this one cannot trigger itself; it also
# listens to main only, never to changeset-release/main.
#
# Needs the repository setting Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests", otherwise the push succeeds and opening the pull request fails with a 403. contents: write is for pushing
# the version branch (the other workflows only read). A pull request opened with GITHUB_TOKEN does not start the
# pull_request workflows, so the Release PR gets no CI checks; they run on main after it is merged.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
# one run at a time; a newer push waits rather than cancelling a run half way through updating the branch
concurrency:
  group: version-pr
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          pr-title: Release
          commit-message: Release
