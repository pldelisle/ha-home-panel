name: Release
# Runs on every push to main. When package.json's version has no published GitHub release yet, it builds that version,
# runs the unit tests, zips dist/ and creates the release v<version> with that version's CHANGELOG.md section as the
# notes and home-panel.zip attached. Merging the "Release" pull request (version-pr.yml) is what bumps the version, so
# that merge is what publishes; any other push to main finds the release and exits early.
#
# This is the only place that creates tags, and it does not run `git tag`: `gh release create --target <sha>` makes
# GitHub create the tag v<version> at that commit when the release is published. Tags made with GITHUB_TOKEN start no
# workflows, which is why this runs on the push to main and not on a tag. gh creates a release that has files as a
# draft, uploads them and only then publishes it, so a failed upload leaves a draft and no tag. The next run removes
# that draft and starts over. A tag with no release (made by hand, or by an interrupted run) is completed, not
# skipped, but only when it points at the commit being built; otherwise the run fails rather than attach a zip built
# from one commit to a tag on another.
#
# If the run for the Release pull request's merge fails, re-run that failed run (it builds the same commit). Do not
# push another commit to main first: the next push would publish this version from that later commit.
#
# GH_TOKEN, a token that can write, is given to the two steps that call gh and to no other, so the install scripts,
# the build and the tests never see it.
on:
  push:
    branches: [main]
permissions:
  contents: write
# one run at a time, and a run that has started is never cancelled half way through publishing; a newer push waits
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, to see whether v<version> exists
          persist-credentials: false # nothing here pushes with git; gh calls the API with GH_TOKEN
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Is this version released already?
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          export TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # every release for the tag, as "<id> <draft>"; gh fails the step on an API error
          RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          if grep -q ' false$' <<< "$RELEASES"; then
            echo "Release $TAG already exists, nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while read -r ID DRAFT; do
            [ -n "$ID" ] || continue
            echo "Deleting the draft release $ID that an earlier run left for $TAG."
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
          done <<< "$RELEASES"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            TAGGED=$(git rev-list -n 1 "refs/tags/$TAG")
            if [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG exists without a release but points at $TAGGED, not at this commit" \
                "($GITHUB_SHA). A zip built from this commit must not go on that tag. Delete the tag or" \
                "publish the release by hand."
              exit 1
            fi
            echo "Tag $TAG exists at this commit but its release does not; completing the release."
          else
            echo "No tag or release for $TAG yet; publishing it from $GITHUB_SHA."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # first, so that a version without a changelog section fails before anything is built or published
      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.exists != 'true'
        run: node scripts/changelog-section.mjs "$VERSION" > notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.exists != 'true'
        run: npm ci
      - if: steps.version.outputs.exists != 'true'
        run: npm run build
      - if: steps.version.outputs.exists != 'true'
        run: npm test
      - name: Zip dist/ (the files at the root of the zip)
        if: steps.version.outputs.exists != 'true'
        run: |
          (cd dist && zip -r ../home-panel.zip .)
          (cd dist && find . -type f | sed 's|^\./||' | sort) > "$RUNNER_TEMP/dist.txt"
          unzip -Z1 home-panel.zip | grep -v '/$' | sort > "$RUNNER_TEMP/zip.txt"
          cat "$RUNNER_TEMP/zip.txt"
          grep -qx 'home-panel.js' "$RUNNER_TEMP/zip.txt"
          # its source map, beside it, so DevTools and stack traces on the tablet point at src/
          grep -qx 'home-panel.js.map' "$RUNNER_TEMP/zip.txt"
          # every file the build put in dist/ (chunks/ and LICENSES.md included) is at its place in the zip
          diff "$RUNNER_TEMP/dist.txt" "$RUNNER_TEMP/zip.txt"
      - name: Create the release (and its tag)
        if: steps.version.outputs.exists != 'true'
        run: |
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          # completing an older version must not take the Latest badge from a newer release
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> /dev/null || true)
          HIGHEST=$(printf '%s\n' "${LATEST#v}" "$VERSION" | sort -V | tail -n 1)
          if [ -n "$LATEST" ] && [ "$HIGHEST" != "$VERSION" ]; then
            FLAGS+=(--latest=false)
          fi
          gh release create "v$VERSION" home-panel.zip --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file notes.md "${FLAGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
