<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Home panel test house</title>
    <style>
      body {
        margin: 0;
        background: #f2f0eb;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // A made-up house for the tests: no real people, places or devices. Two modes:
      //   ?house=full  (default) thermostats, lights, sensors, a car, an EV charger, a water heater, Environment Canada weather
      //   ?house=bare  only the sun, one weather entity and one light: every optional section must stay hidden
      //   &forecast=1  a daily forecast for today and the next five days, which the weather subscription delivers (off by default,
      //                so the weather views of the visual baselines stay as they are)
      //   &french_areas=1  the areas (and the thermostats named after them) carry French names, Salon for Living room, as a
      //                French-speaking household gives them in Home Assistant; the panel reads them in the language of the profile (#134)
      //   &two=1       a second panel, window.panel2, in the same page and fed the same hass, with the full house limited to two
      //                rooms and one person (spec 10: each panel shows its own house)
      // window.PANEL_CFG (set before the page loads) becomes the panel's config, as panel_custom's `config:` would.
      import '/panel/home-panel.js';
      import {readHouse} from '/houses/read.mjs';
      const params = new URLSearchParams(location.search),
        full = (params.get('house') || 'full') === 'full';
      // The house is data in test/houses/ (the unit tests read the same modules); the page's own clock and zone decide
      // what its time markers mean. Nothing here describes the house: this page is its hass, and the test's side of the seam.
      const {house: blueprint} = await import(full ? '/houses/full.mjs' : '/houses/bare.mjs');
      const now = Date.now(),
        iso = t => new Date(t).toISOString();
      // window.AUTOMATIONS (set before the page loads) replaces the full house's automations
      const read = readHouse(blueprint, {
        now,
        frenchAreas: params.get('french_areas') === '1',
        automations: full ? (window.AUTOMATIONS ?? blueprint.automations) : blueprint.automations,
      });
      // the live subscriptions the panel holds (`subscribeMessage`), so the test's side can deliver a message to them
      const subscriptions = new Set();
      const hass = {
        states: read.states,
        entities: read.entities,
        devices: read.devices,
        areas: read.areas,
        config: blueprint.config,
        user: {...blueprint.user, is_admin: blueprint.user.is_admin && params.get('admin') !== '0'},
        locale: {language: params.get('lang') || 'en'},
        services: blueprint.services,
        callService: async (d, s, data) => {
          console.log('SERVICE', d + '.' + s, JSON.stringify(data));
        },
        // the frontend's system data (the panel keeps the house-wide light order there); window.SYSDATA can preset it. Every other
        // message is the house's to answer (the registries, the recorder), the way fakeHass.fromHouse answers it in Vitest
        callWS: async m =>
          m.type === 'frontend/get_system_data'
            ? {value: (window.SYSDATA || {})[m.key] ?? null}
            : m.type === 'frontend/set_system_data'
              ? (console.log('WS', JSON.stringify(m)), ((window.SYSDATA = window.SYSDATA || {})[m.key] = m.value), null)
              : read.ws(m),
        connection: {
          subscribeMessage: async (callback, msg) => {
            console.log('WS', JSON.stringify(msg)); // the fixture's `ws` lists it, as it lists the system-data writes
            const entry = {callback, msg};
            subscriptions.add(entry);
            if (params.get('forecast') === '1' && msg.forecast_type === 'daily')
              callback({
                forecast: Array.from({length: 6}, (_, i) => ({
                  datetime: iso(now + i * 864e5),
                  condition: 'cloudy',
                  temperature: 8 + i,
                  templow: i - 2,
                })),
              });
            return () => subscriptions.delete(entry);
          },
          subscribeEvents: async () => () => {},
        },
        hassUrl: p => p,
        formatEntityState: s => s.state,
      };
      window.hass = hass;
      const el = document.createElement('home-panel');
      el.hass = hass;
      el.narrow = innerWidth < 870;
      el.panel = window.PANEL_CFG ? {config: window.PANEL_CFG} : {};
      document.body.appendChild(el);
      window.panel = el;
      const panels = [el];
      if (params.get('two') === '1') {
        const el2 = document.createElement('home-panel');
        el2.hass = hass;
        el2.narrow = el.narrow;
        el2.panel = {
          config: {...(window.PANEL_CFG || {}), people: ['Alex'], rooms: ['climate.living_room', 'climate.office']},
        };
        document.body.appendChild(el2);
        window.panel2 = el2;
        panels.push(el2);
      }
      // the test's side of the boundary: what Home Assistant does on a state change, a new state object inside a new hass object
      window.house = {
        // Home Assistant sends a forecast on a `weather/subscribe_forecast` subscription: every live one of this type hears it
        forecast(type, entries) {
          for (const {callback, msg} of subscriptions)
            if (msg.type === 'weather/subscribe_forecast' && msg.forecast_type === type) callback({forecast: entries});
        },
        // how many subscriptions of a kind are live: what the panel holds, not what it asked for
        subscribed(kind) {
          return [...subscriptions].filter(({msg}) => msg.type === kind).length;
        },
        setState(id, patch) {
          const prev = hass.states[id] || {entity_id: id, state: '', attributes: {}};
          // Home Assistant hands over a new states object with the changed state in it, which is how a store tells what changed
          hass.states = {
            ...hass.states,
            [id]: {...prev, ...patch, attributes: {...prev.attributes, ...(patch.attributes || {})}},
          };
          for (const p of panels) p.hass = {...hass};
        },
        // an area is renamed in Home Assistant: a new areas registry inside a new hass object
        setAreaName(id, name) {
          hass.areas = {...hass.areas, [id]: {...hass.areas[id], name}};
          for (const p of panels) p.hass = {...hass};
        },
        // the profile language changes: Home Assistant hands the panel a new hass with it, and keeps it for every later state change
        setLanguage(lang) {
          hass.locale = {language: lang};
          for (const p of panels) p.hass = {...hass};
        },
      };
    </script>
  </body>
</html>
